services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.0
    hostname: spire-server
    user: "0:0"
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./conf/server/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-data:/opt/spire/data/server
    ports: ["8081:8081"]
    networks: [spiffe-net]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 5s
      timeout: 3s
      retries: 20
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.0
    hostname: spire-agent
    user: "0:0"
    pid: host
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-}"]
    depends_on:
      spire-server: { condition: service_healthy }
    volumes:
      - ./conf/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-agent-data:/opt/spire/data/agent
      - workload-api:/tmp/spire-agent/public
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [spiffe-net]
    labels: ["app=spire-agent"]
  ledger-server:
    build: .
    image: spiffe-echo-lab:local
    pid: host
    command: ["/ledger-server"]
    depends_on: [spire-agent]
    environment: { SPIFFE_ENDPOINT_SOCKET: "unix:///tmp/spire-agent/public/api.sock" }
    volumes: ["workload-api:/tmp/spire-agent/public:ro"]
    ports: ["8443:8443"]
    networks: [spiffe-net]
    labels: ["app=ledger-server"]
  order-client:
    image: spiffe-echo-lab:local
    build: .
    pid: host
    command: ["/order-client"]
    depends_on: [ledger-server]
    environment: { SPIFFE_ENDPOINT_SOCKET: "unix:///tmp/spire-agent/public/api.sock" }
    volumes: ["workload-api:/tmp/spire-agent/public:ro"]
    networks: [spiffe-net]
    labels: ["app=order-client"]
  rogue-client:
    image: spiffe-echo-lab:local
    pid: host
    command: ["/order-client"]
    depends_on: [ledger-server]
    environment: { SPIFFE_ENDPOINT_SOCKET: "unix:///tmp/spire-agent/public/api.sock" }
    volumes: ["workload-api:/tmp/spire-agent/public:ro"]
    networks: [spiffe-net]
    labels: ["app=rogue-client"]
networks:
  spiffe-net:
    name: spiffe-net
    driver: bridge
volumes:
  spire-server-data:
  spire-agent-data:
  workload-api:
